[Config HeterogeneousZonalTopology]
network = examples.heterogenous_topology.HeterogenousTopology
sim-time-limit = 1s

# ============================================================
# BUS CONFIGURATIONS
# ============================================================
# 1. Legacy Domain (500kbps)
HeterogeneousZonalTopology.busLegacy.bandwidth = 500kbps
HeterogeneousZonalTopology.busLegacy.dataBitrate = 500kbps
HeterogeneousZonalTopology.busLegacy.version = "2.0B"

# 2. Backbone (5Mbps) - Simulating High Bandwidth Link
HeterogeneousZonalTopology.busBackbone.bandwidth = 1Mbps
HeterogeneousZonalTopology.busBackbone.dataBitrate = 5Mbps 
HeterogeneousZonalTopology.busBackbone.version = "CANFD"

# 3. Actuator Domain (5Mbps)
HeterogeneousZonalTopology.busActuator.bandwidth = 1Mbps
HeterogeneousZonalTopology.busActuator.dataBitrate = 5Mbps
HeterogeneousZonalTopology.busActuator.version = "CANFD"

# ============================================================
# NODES
# ============================================================
# Sensor Node (ID 10)
HeterogeneousZonalTopology.sensorNode.numSourceApps = 1
HeterogeneousZonalTopology.sensorNode.sourceApp[*].typename = "CanTrafficSourceAppBase"
HeterogeneousZonalTopology.sensorNode.sourceApp[0].idDataFrames = "10"
HeterogeneousZonalTopology.sensorNode.sourceApp[0].periodicityDataFrames = "0.050" # 20Hz
HeterogeneousZonalTopology.sensorNode.sourceApp[0].dataLengthDataFrames = "8"
HeterogeneousZonalTopology.sensorNode.bufferIn[0].idIncomingFrames = ""

# Actuator Node (Receiver)
HeterogeneousZonalTopology.actuatorNode.numSourceApps = 0
HeterogeneousZonalTopology.actuatorNode.bufferIn[0].idIncomingFrames = "10"

# ============================================================
# GATEWAYS ROUTING
# ============================================================
# Gateway 1: Routes ID 10 from Legacy(Std) to Backbone(Fd)
HeterogeneousZonalTopology.gateway1.gatewayApp.typename = "CanGatewayApp"
HeterogeneousZonalTopology.gateway1.bufferInStd.idIncomingFrames = "10"
HeterogeneousZonalTopology.gateway1.bufferInFd.idIncomingFrames = "" # Nothing from backbone

# Gateway 2: Routes ID 10 from Backbone(Fd) to Actuator(Std port connected to 'busActuator')
# Note: In NED, gateway2.gateStd is connected to busActuator.
# This means traffic must go InFd -> OutStd.
HeterogeneousZonalTopology.gateway2.gatewayApp.typename = "CanGatewayApp"
HeterogeneousZonalTopology.gateway2.bufferInFd.idIncomingFrames = "10"
HeterogeneousZonalTopology.gateway2.bufferInStd.idIncomingFrames = ""

# Logging
**.vector-recording = true
**.scalar-recording = true
