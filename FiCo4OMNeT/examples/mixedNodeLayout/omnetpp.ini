[Config Simple]
network = fico4omnet.examples.mixedNodeLayout.MixedNodeLayout

sim-time-limit = 0.5s

# Bus supports both CAN and CAN-FD
MixedNodeLayout.bus.bandwidth = 500kbps          # Nominal/arbitration rate
MixedNodeLayout.bus.dataBitrate = 5Mbps          # CAN-FD data phase rate
MixedNodeLayout.bus.version = "2.0A"
MixedNodeLayout.bus.bitStuffingPercentage = 0

# Classical CAN Node 1 (Green) - ID 10
MixedNodeLayout.canNode.numSourceApps = 1
MixedNodeLayout.canNode.sourceApp[*].typename = "CanTrafficSourceAppBase"
MixedNodeLayout.canNode.sourceApp[0].idDataFrames = "10"
MixedNodeLayout.canNode.sourceApp[0].periodicityDataFrames = "0.012"   # 12ms period
MixedNodeLayout.canNode.sourceApp[0].initialDataFrameOffset = "0.000"  # T=0ms
MixedNodeLayout.canNode.sourceApp[0].dataLengthDataFrames = "8"

# CAN-FD Node 1 (Gold) - ID 15
MixedNodeLayout.canFdNode.numSourceApps = 1
MixedNodeLayout.canFdNode.sourceApp[*].typename = "CanTrafficSourceAppBase"
MixedNodeLayout.canFdNode.sourceApp[0].idDataFrames = "15"
MixedNodeLayout.canFdNode.sourceApp[0].periodicityDataFrames = "0.012"
MixedNodeLayout.canFdNode.sourceApp[0].initialDataFrameOffset = "0.003" # T=3ms
MixedNodeLayout.canFdNode.sourceApp[0].dataLengthDataFrames = "64"

# Classical CAN Node 2 (Green) - ID 20
MixedNodeLayout.canNode2.numSourceApps = 1
MixedNodeLayout.canNode2.sourceApp[*].typename = "CanTrafficSourceAppBase"
MixedNodeLayout.canNode2.sourceApp[0].idDataFrames = "20"
MixedNodeLayout.canNode2.sourceApp[0].periodicityDataFrames = "0.012"
MixedNodeLayout.canNode2.sourceApp[0].initialDataFrameOffset = "0.006" # T=6ms
MixedNodeLayout.canNode2.sourceApp[0].dataLengthDataFrames = "8"

# CAN-FD Node 2 (Gold) - ID 25
MixedNodeLayout.canFdNode2.numSourceApps = 1
MixedNodeLayout.canFdNode2.sourceApp[*].typename = "CanTrafficSourceAppBase"
MixedNodeLayout.canFdNode2.sourceApp[0].idDataFrames = "25"
MixedNodeLayout.canFdNode2.sourceApp[0].periodicityDataFrames = "0.012"
MixedNodeLayout.canFdNode2.sourceApp[0].initialDataFrameOffset = "0.009" # T=9ms
MixedNodeLayout.canFdNode2.sourceApp[0].dataLengthDataFrames = "32"

# Receive Logic (Update Filters)
MixedNodeLayout.canNode.bufferIn[0].idIncomingFrames = "15,20,25"
MixedNodeLayout.canNode2.bufferIn[0].idIncomingFrames = "10,15,25"
MixedNodeLayout.canFdNode.bufferIn[0].idIncomingFrames = "10,20,25"
MixedNodeLayout.canFdNode2.bufferIn[0].idIncomingFrames = "10,15,20"

# Reduce logging
**.vector-recording = false
**.scalar-recording = false

**.rxDFPayload.recording = false
**.rxRFPayload.recording = false

# --- Disable object payload stats at SinkApp level (REQUIRED)
**.sinkApp*.rxDFPayload.recording = false
**.sinkApp*.rxRFPayload.recording = false

# Also force-disable any recording mode
**.sinkApp*.rxDFPayload.result-recording-modes = none
**.sinkApp*.rxRFPayload.result-recording-modes = none

