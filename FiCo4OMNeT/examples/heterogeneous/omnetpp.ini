[Config Heterogeneous]
network = fico4omnet.examples.heterogeneous.HeterogeneousNetwork
sim-time-limit = 1s

# ============================================================
# BUS CONFIGURATIONS
# ============================================================
HeterogeneousNetwork.busStd.bandwidth = 500kbps
HeterogeneousNetwork.busStd.dataBitrate = 500kbps
HeterogeneousNetwork.busStd.version = "2.0B"

HeterogeneousNetwork.busFd.bandwidth = 500kbps
HeterogeneousNetwork.busFd.dataBitrate = 5Mbps
HeterogeneousNetwork.busFd.version = "2.0B"

HeterogeneousNetwork.busStd2.bandwidth = 500kbps
HeterogeneousNetwork.busStd2.dataBitrate = 500kbps
HeterogeneousNetwork.busStd2.version = "2.0B"

HeterogeneousNetwork.busFd2.bandwidth = 500kbps
HeterogeneousNetwork.busFd2.dataBitrate = 5Mbps
HeterogeneousNetwork.busFd2.version = "2.0B"

# ============================================================
# STANDARD CAN NODES
# ============================================================
# canStdNode1 (Main Bus) - ID 10
HeterogeneousNetwork.canStdNode1.numSourceApps = 1
HeterogeneousNetwork.canStdNode1.sourceApp[*].typename = "CanTrafficSourceAppBase"
HeterogeneousNetwork.canStdNode1.sourceApp[0].idDataFrames = "10"
HeterogeneousNetwork.canStdNode1.sourceApp[0].periodicityDataFrames = "0.100"
HeterogeneousNetwork.canStdNode1.sourceApp[0].dataLengthDataFrames = "8"
HeterogeneousNetwork.canStdNode1.bufferIn[0].idIncomingFrames = "20"

# canStdNode2 (Bridge Wrapper)
# node1 inside wrapper -> Main Bus (ID 30)
HeterogeneousNetwork.canStdNode2.node1.numSourceApps = 1
HeterogeneousNetwork.canStdNode2.node1.sourceApp[*].typename = "CanTrafficSourceAppBase"
HeterogeneousNetwork.canStdNode2.node1.sourceApp[0].idDataFrames = "30"
HeterogeneousNetwork.canStdNode2.node1.sourceApp[0].periodicityDataFrames = "0.100"
HeterogeneousNetwork.canStdNode2.node1.sourceApp[0].dataLengthDataFrames = "8"
HeterogeneousNetwork.canStdNode2.node1.bufferIn[0].idIncomingFrames = "10"

# node2 inside wrapper -> Isolated Bus (ID 32)
HeterogeneousNetwork.canStdNode2.node2.numSourceApps = 1
HeterogeneousNetwork.canStdNode2.node2.sourceApp[*].typename = "CanTrafficSourceAppBase"
HeterogeneousNetwork.canStdNode2.node2.sourceApp[0].idDataFrames = "32"
HeterogeneousNetwork.canStdNode2.node2.sourceApp[0].periodicityDataFrames = "0.100"
HeterogeneousNetwork.canStdNode2.node2.sourceApp[0].dataLengthDataFrames = "8"
HeterogeneousNetwork.canStdNode2.node2.bufferIn[0].idIncomingFrames = "31"

# canStdNode3 (Isolated Bus) - ID 31
HeterogeneousNetwork.canStdNode3.numSourceApps = 1
HeterogeneousNetwork.canStdNode3.sourceApp[*].typename = "CanTrafficSourceAppBase"
HeterogeneousNetwork.canStdNode3.sourceApp[0].idDataFrames = "31"
HeterogeneousNetwork.canStdNode3.sourceApp[0].periodicityDataFrames = "0.100"
HeterogeneousNetwork.canStdNode3.sourceApp[0].dataLengthDataFrames = "8"
HeterogeneousNetwork.canStdNode3.bufferIn[0].idIncomingFrames = "32"

# ============================================================
# CAN-FD NODES
# ============================================================
# canFdNode1 (Main Bus) - ID 20
HeterogeneousNetwork.canFdNode1.numSourceApps = 1
HeterogeneousNetwork.canFdNode1.sourceApp[*].typename = "CanTrafficSourceAppBase"
HeterogeneousNetwork.canFdNode1.sourceApp[0].idDataFrames = "20"
HeterogeneousNetwork.canFdNode1.sourceApp[0].periodicityDataFrames = "0.100"
HeterogeneousNetwork.canFdNode1.sourceApp[0].dataLengthDataFrames = "64"
HeterogeneousNetwork.canFdNode1.bufferIn[0].idIncomingFrames = "10"

# canFdNode2 (Bridge Wrapper)
# node1 inside wrapper -> Main Bus (ID 40)
HeterogeneousNetwork.canFdNode2.node1.numSourceApps = 1
HeterogeneousNetwork.canFdNode2.node1.sourceApp[*].typename = "CanTrafficSourceAppBase"
HeterogeneousNetwork.canFdNode2.node1.sourceApp[0].idDataFrames = "40"
HeterogeneousNetwork.canFdNode2.node1.sourceApp[0].periodicityDataFrames = "0.100"
HeterogeneousNetwork.canFdNode2.node1.sourceApp[0].dataLengthDataFrames = "64"
HeterogeneousNetwork.canFdNode2.node1.bufferIn[0].idIncomingFrames = "20"

# node2 inside wrapper -> Isolated Bus (ID 42)
HeterogeneousNetwork.canFdNode2.node2.numSourceApps = 1
HeterogeneousNetwork.canFdNode2.node2.sourceApp[*].typename = "CanTrafficSourceAppBase"
HeterogeneousNetwork.canFdNode2.node2.sourceApp[0].idDataFrames = "42"
HeterogeneousNetwork.canFdNode2.node2.sourceApp[0].periodicityDataFrames = "0.100"
HeterogeneousNetwork.canFdNode2.node2.sourceApp[0].dataLengthDataFrames = "64"
HeterogeneousNetwork.canFdNode2.node2.bufferIn[0].idIncomingFrames = "41"

# canFdNode3 (Isolated Bus) - ID 41
HeterogeneousNetwork.canFdNode3.numSourceApps = 1
HeterogeneousNetwork.canFdNode3.sourceApp[*].typename = "CanTrafficSourceAppBase"
HeterogeneousNetwork.canFdNode3.sourceApp[0].idDataFrames = "41"
HeterogeneousNetwork.canFdNode3.sourceApp[0].periodicityDataFrames = "0.100"
HeterogeneousNetwork.canFdNode3.sourceApp[0].dataLengthDataFrames = "64"
HeterogeneousNetwork.canFdNode3.bufferIn[0].idIncomingFrames = "42"

# ============================================================
# GATEWAY
# ============================================================
HeterogeneousNetwork.gateway.gatewayApp.typename = "CanGatewayApp"
HeterogeneousNetwork.gateway.bufferInStd.idIncomingFrames = "10 30"
HeterogeneousNetwork.gateway.bufferInFd.idIncomingFrames = "20 40"

# Logging
**.vector-recording = true
**.scalar-recording = true
