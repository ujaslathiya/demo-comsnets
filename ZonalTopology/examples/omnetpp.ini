[General]
network          = zonal_topology.ZonalTopology
sim-time-limit = 60s
cmdenv-express-mode   = true
cmdenv-event-banners  = false

# ============================================================================
# TSN SCHEDULER — global timing base for all TSN nodes and switches
# Tick = 80 ns; cycle = 1 ms (automotive standard matching 2ms CAN period/2)
# ============================================================================
**.scheduler.tick                    = 80ns
**.scheduler.numPeriods              = 1
**.scheduler.period[0].cycle_ticks   = sec_to_tick(1ms)
# Clock accuracy: 200 ppm max drift, ±50 ppm per cycle change
**.scheduler.oscillator.max_drift    = 200ppm
**.scheduler.oscillator.drift_change = uniform(-50ppm,50ppm)
**.precission                        = 500ns

# Bind all gate control lists to the single 1 ms period
**.gateControlList.period            = "period[0]"

# SR Class PCP assignments (IEEE 802.1Qav)
**.pcpSRClassA                       = 7
**.pcpSRClassB                       = 6

# ============================================================================
# ZONE 1: CAN Standard (3 ECUs: Node_A, Node_B, Node_C)
# ============================================================================
*.CAN_Std_Bus.bandwidth                              = 500kbps

*.CAN_Std_Node_A.numSourceApps                       = 1
*.CAN_Std_Node_A.sourceApp[0].typename               = "CanTrafficSourceAppBase"
*.CAN_Std_Node_A.sourceApp[0].idDataFrames           = "100"
*.CAN_Std_Node_A.sourceApp[0].periodicityDataFrames  = "0.002"
*.CAN_Std_Node_A.sourceApp[0].initialDataFrameOffset = "0.001"
*.CAN_Std_Node_A.sourceApp[0].dataLengthDataFrames   = "8"
*.CAN_Std_Node_A.numSinkApps                         = 1
*.CAN_Std_Node_A.sinkApp[0].typename                 = "CanTrafficSinkAppBase"
*.CAN_Std_Node_A.bufferIn.idIncomingFrames           = "110,120"

*.CAN_Std_Node_B.numSourceApps                       = 1
*.CAN_Std_Node_B.sourceApp[0].typename               = "CanTrafficSourceAppBase"
*.CAN_Std_Node_B.sourceApp[0].idDataFrames           = "110"
*.CAN_Std_Node_B.sourceApp[0].periodicityDataFrames  = "0.002"
*.CAN_Std_Node_B.sourceApp[0].initialDataFrameOffset = "0.0015"
*.CAN_Std_Node_B.sourceApp[0].dataLengthDataFrames   = "8"
*.CAN_Std_Node_B.numSinkApps                         = 1
*.CAN_Std_Node_B.sinkApp[0].typename                 = "CanTrafficSinkAppBase"
*.CAN_Std_Node_B.bufferIn.idIncomingFrames           = "100,120"

*.CAN_Std_Node_C.numSourceApps                       = 1
*.CAN_Std_Node_C.sourceApp[0].typename               = "CanTrafficSourceAppBase"
*.CAN_Std_Node_C.sourceApp[0].idDataFrames           = "120"
*.CAN_Std_Node_C.sourceApp[0].periodicityDataFrames  = "0.002"
*.CAN_Std_Node_C.sourceApp[0].initialDataFrameOffset = "0.002"
*.CAN_Std_Node_C.sourceApp[0].dataLengthDataFrames   = "8"
*.CAN_Std_Node_C.numSinkApps                         = 1
*.CAN_Std_Node_C.sinkApp[0].typename                 = "CanTrafficSinkAppBase"
*.CAN_Std_Node_C.bufferIn.idIncomingFrames           = "100,110"

# ============================================================================
# ZONE 2: CAN-FD (3 ECUs: Node_A, Node_B, Node_C on shared CAN_FD_Bus)
# ============================================================================
*.CAN_FD_Bus.bandwidth                               = 2000kbps
*.CAN_FD_Bus.dataBitrate                             = 5000kbps

*.CAN_FD_Node_A.numSourceApps                        = 1
*.CAN_FD_Node_A.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_FD_Node_A.sourceApp[0].idDataFrames            = "300"
*.CAN_FD_Node_A.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_FD_Node_A.sourceApp[0].initialDataFrameOffset  = "0.002"
*.CAN_FD_Node_A.sourceApp[0].dataLengthDataFrames    = "64"
*.CAN_FD_Node_A.numSinkApps                          = 1
*.CAN_FD_Node_A.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_FD_Node_A.bufferIn.idIncomingFrames            = "200,210"

*.CAN_FD_Node_B.numSourceApps                        = 1
*.CAN_FD_Node_B.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_FD_Node_B.sourceApp[0].idDataFrames            = "200"
*.CAN_FD_Node_B.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_FD_Node_B.sourceApp[0].initialDataFrameOffset  = "0.003"
*.CAN_FD_Node_B.sourceApp[0].dataLengthDataFrames    = "64"
*.CAN_FD_Node_B.numSinkApps                          = 1
*.CAN_FD_Node_B.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_FD_Node_B.bufferIn.idIncomingFrames            = "210,300"

*.CAN_FD_Node_C.numSourceApps                        = 1
*.CAN_FD_Node_C.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_FD_Node_C.sourceApp[0].idDataFrames            = "210"
*.CAN_FD_Node_C.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_FD_Node_C.sourceApp[0].initialDataFrameOffset  = "0.004"
*.CAN_FD_Node_C.sourceApp[0].dataLengthDataFrames    = "64"
*.CAN_FD_Node_C.numSinkApps                          = 1
*.CAN_FD_Node_C.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_FD_Node_C.bufferIn.idIncomingFrames            = "200,300"

# ============================================================================
# ZONE 3: TSN Automotive Ethernet (3 ECUs: Node_A, Node_B, Node_C)
#
# ETH Nodes use TSNEtherHost with IEEE8021QTrafficSourceApp:
#   PCP 4 / VID 1 = prioritised best-effort automotive data
# ============================================================================

# ── Node MAC addresses ────────────────────────────────────────────────────────
*.Ethernet_Node_A.phy[0].mac.address   = "0A:00:00:00:00:11"
*.Ethernet_Node_B.phy[0].mac.address   = "0A:00:00:00:00:12"
*.Ethernet_Node_C.phy[0].mac.address   = "0A:00:00:00:00:13"

# ── Applications: IEEE 802.1Q tagged traffic source ────────────────────────
*.Ethernet_Node_A.numApps = 1
*.Ethernet_Node_A.app[0].typename     = "IEEE8021QTrafficSourceApp"
*.Ethernet_Node_A.app[0].destAddress  = "ff:ff:ff:ff:ff:ff"
*.Ethernet_Node_A.app[0].payload      = 100Byte
*.Ethernet_Node_A.app[0].sendInterval = 2ms
*.Ethernet_Node_A.app[0].priority     = 4
*.Ethernet_Node_A.app[0].vid         = 1

*.Ethernet_Node_B.numApps = 1
*.Ethernet_Node_B.app[0].typename     = "IEEE8021QTrafficSourceApp"
*.Ethernet_Node_B.app[0].destAddress  = "ff:ff:ff:ff:ff:ff"
*.Ethernet_Node_B.app[0].payload      = 100Byte
*.Ethernet_Node_B.app[0].sendInterval = 2ms
*.Ethernet_Node_B.app[0].priority     = 4
*.Ethernet_Node_B.app[0].vid         = 1

*.Ethernet_Node_C.numApps = 1
*.Ethernet_Node_C.app[0].typename     = "IEEE8021QTrafficSourceApp"
*.Ethernet_Node_C.app[0].destAddress  = "ff:ff:ff:ff:ff:ff"
*.Ethernet_Node_C.app[0].payload      = 100Byte
*.Ethernet_Node_C.app[0].sendInterval = 2ms
*.Ethernet_Node_C.app[0].priority     = 4
*.Ethernet_Node_C.app[0].vid         = 1

# ── Node port gate control (all gates always open on host side) ───────────
*.Ethernet_Node_*.phy[*].shaper.gateControlList.controlList = "o,o,o,o,o,o,o,o:0"

# ── Node VLAN: send VID 1 tagged frames ──────────────────────────────────
*.Ethernet_Node_*.phy[*].taggedVIDs    = "1"
*.Ethernet_Node_*.phy[*].untaggedVID   = 0

# ============================================================================
# TSN EDGE SWITCHES (A/B/C) — IEEE 802.1Qbv TAS + IEEE 802.1Qav CBS
#
# Gate Control List (1 ms cycle, 100 Mbps links):
#   0 µs  – 250 µs : Gates 0-6 OPEN,  gate 7 CLOSED  → BE / SR-B window
#   250 µs – 375 µs: ALL CLOSED                        → guard band
#   375 µs – 625 µs: Gates 0-6 CLOSED, gate 7 OPEN    → SR Class A window
#   625 µs – 1000µs: Repeats from t=0
# ============================================================================

# ── CBS — SR Class A (PCP 7) and B (PCP 6) on each edge switch port ──────
*.Ethernet_Switch_A.phy[*].shaper.transmissionSelectionAlgorithm[7].typename        = "CreditBasedShaper"
*.Ethernet_Switch_A.phy[*].shaper.transmissionSelectionAlgorithm[7].srClass         = "A"
*.Ethernet_Switch_A.phy[*].shaper.transmissionSelectionAlgorithm[7].staticIdleSlope = 10Mbps
*.Ethernet_Switch_A.phy[*].shaper.transmissionSelectionAlgorithm[6].typename        = "CreditBasedShaper"
*.Ethernet_Switch_A.phy[*].shaper.transmissionSelectionAlgorithm[6].srClass         = "B"
*.Ethernet_Switch_A.phy[*].shaper.transmissionSelectionAlgorithm[6].staticIdleSlope = 5Mbps

*.Ethernet_Switch_B.phy[*].shaper.transmissionSelectionAlgorithm[7].typename        = "CreditBasedShaper"
*.Ethernet_Switch_B.phy[*].shaper.transmissionSelectionAlgorithm[7].srClass         = "A"
*.Ethernet_Switch_B.phy[*].shaper.transmissionSelectionAlgorithm[7].staticIdleSlope = 10Mbps
*.Ethernet_Switch_B.phy[*].shaper.transmissionSelectionAlgorithm[6].typename        = "CreditBasedShaper"
*.Ethernet_Switch_B.phy[*].shaper.transmissionSelectionAlgorithm[6].srClass         = "B"
*.Ethernet_Switch_B.phy[*].shaper.transmissionSelectionAlgorithm[6].staticIdleSlope = 5Mbps

*.Ethernet_Switch_C.phy[*].shaper.transmissionSelectionAlgorithm[7].typename        = "CreditBasedShaper"
*.Ethernet_Switch_C.phy[*].shaper.transmissionSelectionAlgorithm[7].srClass         = "A"
*.Ethernet_Switch_C.phy[*].shaper.transmissionSelectionAlgorithm[7].staticIdleSlope = 10Mbps
*.Ethernet_Switch_C.phy[*].shaper.transmissionSelectionAlgorithm[6].typename        = "CreditBasedShaper"
*.Ethernet_Switch_C.phy[*].shaper.transmissionSelectionAlgorithm[6].srClass         = "B"
*.Ethernet_Switch_C.phy[*].shaper.transmissionSelectionAlgorithm[6].staticIdleSlope = 5Mbps

# ── TAS Gate Control List on all edge switch ports ────────────────────────
*.Ethernet_Switch_A.phy[*].shaper.gateControlList.controlList = "o,o,o,o,o,o,o,C:0;C,C,C,C,C,C,C,C:0.000250;C,C,C,C,C,C,C,o:0.000375;o,o,o,o,o,o,o,C:0.000625"
*.Ethernet_Switch_B.phy[*].shaper.gateControlList.controlList = "o,o,o,o,o,o,o,C:0;C,C,C,C,C,C,C,C:0.000250;C,C,C,C,C,C,C,o:0.000375;o,o,o,o,o,o,o,C:0.000625"
*.Ethernet_Switch_C.phy[*].shaper.gateControlList.controlList = "o,o,o,o,o,o,o,C:0;C,C,C,C,C,C,C,C:0.000250;C,C,C,C,C,C,C,o:0.000375;o,o,o,o,o,o,o,C:0.000625"

# ── Edge switch VLAN: pass VID 0 (gateway traffic) and VID 1 (ETH nodes) ─
*.Ethernet_Switch_A.phy[*].untaggedVID = 0
*.Ethernet_Switch_A.phy[*].taggedVIDs  = "0,1"
*.Ethernet_Switch_B.phy[*].untaggedVID = 0
*.Ethernet_Switch_B.phy[*].taggedVIDs  = "0,1"
*.Ethernet_Switch_C.phy[*].untaggedVID = 0
*.Ethernet_Switch_C.phy[*].taggedVIDs  = "0,1"

# ============================================================================
# CENTRAL TSN SWITCH — CBS only (1 Gbps aggregation, no TAS needed)
# ============================================================================
*.Central_Switch.phy[*].shaper.transmissionSelectionAlgorithm[7].typename        = "CreditBasedShaper"
*.Central_Switch.phy[*].shaper.transmissionSelectionAlgorithm[7].srClass         = "A"
*.Central_Switch.phy[*].shaper.transmissionSelectionAlgorithm[7].staticIdleSlope = 100Mbps
*.Central_Switch.phy[*].shaper.transmissionSelectionAlgorithm[6].typename        = "CreditBasedShaper"
*.Central_Switch.phy[*].shaper.transmissionSelectionAlgorithm[6].srClass         = "B"
*.Central_Switch.phy[*].shaper.transmissionSelectionAlgorithm[6].staticIdleSlope = 50Mbps

# Gate always open on Central_Switch (CBS shapes the rate, no time-gating needed)
*.Central_Switch.phy[*].shaper.gateControlList.controlList = "o,o,o,o,o,o,o,o:0"
*.Central_Switch.phy[*].untaggedVID = 0
*.Central_Switch.phy[*].taggedVIDs  = "0,1"

# ============================================================================
# ZONE 4: LIN (3 ECUs: Slave_A, Slave_B, Slave_C)
# ============================================================================
*.LIN_Bus.logic.baudRate             = 19.2kbps
*.LIN_Bus.numGates                   = 4
*.LIN_Bus.logic.numGates             = 4
*.LIN_Slave_*.isMaster               = false
*.LIN_Slave_*.baudRate               = 19.2kbps
*.LIN_Slave_A.signalConfiguration    = "30:0:1"
*.LIN_Slave_B.signalConfiguration    = "31:0:2"
*.LIN_Slave_C.signalConfiguration    = "32:0:3"

# ============================================================================
# GATEWAYS
# ============================================================================
*.Gateway_*.enableAggregation        = true
*.Gateway_*.enableFragmentation      = true
*.Gateway_*.processingDelay          = 0.0001s   # 100 µs — realistic automotive ECU latency

# ============================================================================
# STATISTICS RECORDING
# ============================================================================

# ── CAN/CAN-FD bus queue & load ──────────────────────────────────────────
**.txQueue.queueLength.result-recording-modes    = mean,max,vector
**.txQueue.queuingDelay.result-recording-modes   = mean,max,vector
**.busLoad.result-recording-modes                = mean,timeavg

# ── Gateway input buffers ────────────────────────────────────────────────
**.canInputQueueLength.result-recording-modes    = mean,max,vector
**.canFdInputQueueLength.result-recording-modes  = mean,max,vector
**.linInputQueueLength.result-recording-modes    = mean,max,vector
**.canQueuingDelay.result-recording-modes        = mean,max,vector
**.canFdQueuingDelay.result-recording-modes      = mean,max,vector
**.linQueuingDelay.result-recording-modes        = mean,max,vector
**.inputDropCount.result-recording-modes         = last,vector
**.processingDelay.result-recording-modes        = mean,vector
**.uplinkUtil.result-recording-modes             = mean,timeavg

# ── Ethernet switch port queuing ─────────────────────────────────────────
**.port[*].queueLength.result-recording-modes    = mean,max
**.port[*].queuingDelay.result-recording-modes   = mean,max
**.port[*].dropCount.result-recording-modes      = last

# ── TSN specific: CBS credit and gate state ──────────────────────────────
**.credit.result-recording-modes                 = vector
**.reservedBandwidth.result-recording-modes      = vector

# ── Per-node CAN/CAN-FD end-to-end delay (gateway ground truth) ─────────────
# rxDFLatency uses timestampAge(rxDF): sim-time minus the timestamp set by
# CanTrafficSourceAppBase.cc on each outgoing frame — true e2e delay.
# Recorded at both the sink app and the canPortInput (same value, two views).
**.sinkApp[*].rxDFLatency.result-recording-modes               = mean,max,vector
**.canNodePort.canPortInput.rxDFLatency.result-recording-modes = mean,max,vector

# ── Output files ─────────────────────────────────────────────────────────
output-scalar-file = results/${configname}-${runnumber}.sca
output-vector-file = results/${configname}-${runnumber}.vec
