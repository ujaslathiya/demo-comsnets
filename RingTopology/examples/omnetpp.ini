[General]
network          = ring_topology.RingTopology
sim-time-limit = 1s
cmdenv-express-mode   = true
cmdenv-event-banners  = false

# ============================================================================
# TSN SCHEDULER — global timing base for all TSN switches
# ============================================================================
**.scheduler.tick                    = 80ns
**.scheduler.numPeriods              = 1
**.scheduler.period[0].cycle_ticks   = sec_to_tick(1ms)
**.scheduler.oscillator.max_drift    = 200ppm
**.scheduler.oscillator.drift_change = uniform(-50ppm,50ppm)
**.precission                        = 500ns
**.gateControlList.period            = "period[0]"
**.pcpSRClassA                       = 7
**.pcpSRClassB                       = 6

# ============================================================================
# ZONE A: CAN-FD_A  (3 ECUs → GW_A → SW_A, 2 hops)
# ============================================================================
*.CAN_FD_Bus_A.bandwidth             = 2000kbps
*.CAN_FD_Bus_A.dataBitrate           = 5000kbps

*.CAN_FD_Node_A0.numSourceApps                        = 1
*.CAN_FD_Node_A0.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_FD_Node_A0.sourceApp[0].idDataFrames            = "300"
*.CAN_FD_Node_A0.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_FD_Node_A0.sourceApp[0].initialDataFrameOffset  = "0.001"
*.CAN_FD_Node_A0.sourceApp[0].dataLengthDataFrames    = "64"
*.CAN_FD_Node_A0.numSinkApps                          = 1
*.CAN_FD_Node_A0.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_FD_Node_A0.bufferIn.idIncomingFrames            = "310,320"

*.CAN_FD_Node_A1.numSourceApps                        = 1
*.CAN_FD_Node_A1.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_FD_Node_A1.sourceApp[0].idDataFrames            = "310"
*.CAN_FD_Node_A1.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_FD_Node_A1.sourceApp[0].initialDataFrameOffset  = "0.002"
*.CAN_FD_Node_A1.sourceApp[0].dataLengthDataFrames    = "64"
*.CAN_FD_Node_A1.numSinkApps                          = 1
*.CAN_FD_Node_A1.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_FD_Node_A1.bufferIn.idIncomingFrames            = "300,320"

*.CAN_FD_Node_A2.numSourceApps                        = 1
*.CAN_FD_Node_A2.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_FD_Node_A2.sourceApp[0].idDataFrames            = "320"
*.CAN_FD_Node_A2.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_FD_Node_A2.sourceApp[0].initialDataFrameOffset  = "0.003"
*.CAN_FD_Node_A2.sourceApp[0].dataLengthDataFrames    = "64"
*.CAN_FD_Node_A2.numSinkApps                          = 1
*.CAN_FD_Node_A2.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_FD_Node_A2.bufferIn.idIncomingFrames            = "300,310"

# ============================================================================
# ZONE B: CAN-FD_B  (3 ECUs → GW_B → SW_B → ring8 → SW_A, 3 hops)
# ============================================================================
*.CAN_FD_Bus_B.bandwidth             = 2000kbps
*.CAN_FD_Bus_B.dataBitrate           = 5000kbps

*.CAN_FD_Node_B0.numSourceApps                        = 1
*.CAN_FD_Node_B0.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_FD_Node_B0.sourceApp[0].idDataFrames            = "400"
*.CAN_FD_Node_B0.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_FD_Node_B0.sourceApp[0].initialDataFrameOffset  = "0.001"
*.CAN_FD_Node_B0.sourceApp[0].dataLengthDataFrames    = "64"
*.CAN_FD_Node_B0.numSinkApps                          = 1
*.CAN_FD_Node_B0.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_FD_Node_B0.bufferIn.idIncomingFrames            = "410,420"

*.CAN_FD_Node_B1.numSourceApps                        = 1
*.CAN_FD_Node_B1.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_FD_Node_B1.sourceApp[0].idDataFrames            = "410"
*.CAN_FD_Node_B1.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_FD_Node_B1.sourceApp[0].initialDataFrameOffset  = "0.002"
*.CAN_FD_Node_B1.sourceApp[0].dataLengthDataFrames    = "64"
*.CAN_FD_Node_B1.numSinkApps                          = 1
*.CAN_FD_Node_B1.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_FD_Node_B1.bufferIn.idIncomingFrames            = "400,420"

*.CAN_FD_Node_B2.numSourceApps                        = 1
*.CAN_FD_Node_B2.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_FD_Node_B2.sourceApp[0].idDataFrames            = "420"
*.CAN_FD_Node_B2.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_FD_Node_B2.sourceApp[0].initialDataFrameOffset  = "0.003"
*.CAN_FD_Node_B2.sourceApp[0].dataLengthDataFrames    = "64"
*.CAN_FD_Node_B2.numSinkApps                          = 1
*.CAN_FD_Node_B2.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_FD_Node_B2.bufferIn.idIncomingFrames            = "400,410"

# ============================================================================
# ZONE C: CAN Standard  (3 ECUs → GW_C → SW_C → ring9 → SW_B → ring8 → SW_A, 4 hops)
# ★ Shares ring8 (SW_B→SW_A) with Zone B — KEY cross-zone contention link
# ============================================================================
*.CAN_Std_Bus.bandwidth              = 500kbps

*.CAN_Std_Node_0.numSourceApps                        = 1
*.CAN_Std_Node_0.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_Std_Node_0.sourceApp[0].idDataFrames            = "100"
*.CAN_Std_Node_0.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_Std_Node_0.sourceApp[0].initialDataFrameOffset  = "0.001"
*.CAN_Std_Node_0.sourceApp[0].dataLengthDataFrames    = "8"
*.CAN_Std_Node_0.numSinkApps                          = 1
*.CAN_Std_Node_0.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_Std_Node_0.bufferIn.idIncomingFrames            = "110,120"

*.CAN_Std_Node_1.numSourceApps                        = 1
*.CAN_Std_Node_1.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_Std_Node_1.sourceApp[0].idDataFrames            = "110"
*.CAN_Std_Node_1.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_Std_Node_1.sourceApp[0].initialDataFrameOffset  = "0.0015"
*.CAN_Std_Node_1.sourceApp[0].dataLengthDataFrames    = "8"
*.CAN_Std_Node_1.numSinkApps                          = 1
*.CAN_Std_Node_1.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_Std_Node_1.bufferIn.idIncomingFrames            = "100,120"

*.CAN_Std_Node_2.numSourceApps                        = 1
*.CAN_Std_Node_2.sourceApp[0].typename                = "CanTrafficSourceAppBase"
*.CAN_Std_Node_2.sourceApp[0].idDataFrames            = "120"
*.CAN_Std_Node_2.sourceApp[0].periodicityDataFrames   = "0.002"
*.CAN_Std_Node_2.sourceApp[0].initialDataFrameOffset  = "0.002"
*.CAN_Std_Node_2.sourceApp[0].dataLengthDataFrames    = "8"
*.CAN_Std_Node_2.numSinkApps                          = 1
*.CAN_Std_Node_2.sinkApp[0].typename                  = "CanTrafficSinkAppBase"
*.CAN_Std_Node_2.bufferIn.idIncomingFrames            = "100,110"

# ============================================================================
# ZONE D: LIN  (3 ECUs → GW_D → SW_D → ring10 → SW_A, 3 hops, independent)
# ============================================================================
*.LIN_Bus.logic.baudRate             = 19.2kbps
*.LIN_Bus.numGates                   = 4
*.LIN_Bus.logic.numGates             = 4
*.LIN_Slave_*.isMaster               = false
*.LIN_Slave_*.baudRate               = 19.2kbps
*.LIN_Slave_0.signalConfiguration    = "30:0:1"
*.LIN_Slave_1.signalConfiguration    = "31:0:2"
*.LIN_Slave_2.signalConfiguration    = "32:0:3"

# ============================================================================
# GATEWAYS
# ============================================================================
*.GW_*.enableAggregation        = true
*.GW_*.enableFragmentation      = true
*.GW_*.processingDelay          = 0.0001s   # 100 µs

# ============================================================================
# TSN RING SWITCHES — CBS on all ports (1 Gbps backbone)
# ============================================================================
*.SW_A.phy[*].shaper.transmissionSelectionAlgorithm[7].typename        = "CreditBasedShaper"
*.SW_A.phy[*].shaper.transmissionSelectionAlgorithm[7].srClass         = "A"
*.SW_A.phy[*].shaper.transmissionSelectionAlgorithm[7].staticIdleSlope = 10Mbps
*.SW_A.phy[*].shaper.transmissionSelectionAlgorithm[6].typename        = "CreditBasedShaper"
*.SW_A.phy[*].shaper.transmissionSelectionAlgorithm[6].srClass         = "B"
*.SW_A.phy[*].shaper.transmissionSelectionAlgorithm[6].staticIdleSlope = 5Mbps
*.SW_A.phy[*].shaper.gateControlList.controlList = "o,o,o,o,o,o,o,o:0"
*.SW_A.phy[*].untaggedVID = 0
*.SW_A.phy[*].taggedVIDs  = "0,1"

*.SW_B.phy[*].shaper.transmissionSelectionAlgorithm[7].typename        = "CreditBasedShaper"
*.SW_B.phy[*].shaper.transmissionSelectionAlgorithm[7].srClass         = "A"
*.SW_B.phy[*].shaper.transmissionSelectionAlgorithm[7].staticIdleSlope = 10Mbps
*.SW_B.phy[*].shaper.transmissionSelectionAlgorithm[6].typename        = "CreditBasedShaper"
*.SW_B.phy[*].shaper.transmissionSelectionAlgorithm[6].srClass         = "B"
*.SW_B.phy[*].shaper.transmissionSelectionAlgorithm[6].staticIdleSlope = 5Mbps
*.SW_B.phy[*].shaper.gateControlList.controlList = "o,o,o,o,o,o,o,o:0"
*.SW_B.phy[*].untaggedVID = 0
*.SW_B.phy[*].taggedVIDs  = "0,1"

*.SW_C.phy[*].shaper.transmissionSelectionAlgorithm[7].typename        = "CreditBasedShaper"
*.SW_C.phy[*].shaper.transmissionSelectionAlgorithm[7].srClass         = "A"
*.SW_C.phy[*].shaper.transmissionSelectionAlgorithm[7].staticIdleSlope = 10Mbps
*.SW_C.phy[*].shaper.transmissionSelectionAlgorithm[6].typename        = "CreditBasedShaper"
*.SW_C.phy[*].shaper.transmissionSelectionAlgorithm[6].srClass         = "B"
*.SW_C.phy[*].shaper.transmissionSelectionAlgorithm[6].staticIdleSlope = 5Mbps
*.SW_C.phy[*].shaper.gateControlList.controlList = "o,o,o,o,o,o,o,o:0"
*.SW_C.phy[*].untaggedVID = 0
*.SW_C.phy[*].taggedVIDs  = "0,1"

*.SW_D.phy[*].shaper.transmissionSelectionAlgorithm[7].typename        = "CreditBasedShaper"
*.SW_D.phy[*].shaper.transmissionSelectionAlgorithm[7].srClass         = "A"
*.SW_D.phy[*].shaper.transmissionSelectionAlgorithm[7].staticIdleSlope = 10Mbps
*.SW_D.phy[*].shaper.transmissionSelectionAlgorithm[6].typename        = "CreditBasedShaper"
*.SW_D.phy[*].shaper.transmissionSelectionAlgorithm[6].srClass         = "B"
*.SW_D.phy[*].shaper.transmissionSelectionAlgorithm[6].staticIdleSlope = 5Mbps
*.SW_D.phy[*].shaper.gateControlList.controlList = "o,o,o,o,o,o,o,o:0"
*.SW_D.phy[*].untaggedVID = 0
*.SW_D.phy[*].taggedVIDs  = "0,1"

# ============================================================================
# STATISTICS RECORDING
# ============================================================================
**.txQueue.queueLength.result-recording-modes    = mean,max,vector
**.txQueue.queuingDelay.result-recording-modes   = mean,max,vector
**.busLoad.result-recording-modes                = mean,timeavg
**.canInputQueueLength.result-recording-modes    = mean,max,vector
**.canFdInputQueueLength.result-recording-modes  = mean,max,vector
**.linInputQueueLength.result-recording-modes    = mean,max,vector
**.canQueuingDelay.result-recording-modes        = mean,max,vector
**.canFdQueuingDelay.result-recording-modes      = mean,max,vector
**.linQueuingDelay.result-recording-modes        = mean,max,vector
**.inputDropCount.result-recording-modes         = last,vector
**.processingDelay.result-recording-modes        = mean,vector
**.uplinkUtil.result-recording-modes             = mean,timeavg
**.port[*].queueLength.result-recording-modes    = mean,max
**.port[*].queuingDelay.result-recording-modes   = mean,max
**.port[*].dropCount.result-recording-modes      = last
**.credit.result-recording-modes                 = vector
**.reservedBandwidth.result-recording-modes      = vector
**.sinkApp[*].rxDFLatency.result-recording-modes               = mean,max,vector
**.canNodePort.canPortInput.rxDFLatency.result-recording-modes = mean,max,vector

output-scalar-file = results/${configname}-${runnumber}.sca
output-vector-file = results/${configname}-${runnumber}.vec
